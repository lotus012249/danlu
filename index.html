<style>
/* Layout: one column, six-tab bar at the bottom. Morandi lavender ground; purple = what you act on,
   blue = known results, pink = things you recorded yourself. Danger is a separate brick red.
   The trial bench lights up ingredient tiles directly, so a hint sits where the finger is. */
:root{
  --bg:#ECE9F1; --surface:#F8F6FA; --surface-2:#E0DBE9; --fg:#2B2636; --fg-2:#5E576F; --line:#D0C9DC;
  --accent:#6B5A92; --accent-soft:#DDD6EB; --on-accent:#FBF9FE;
  --blue:#4F6E96; --blue-soft:#DCE4EF; --on-blue:#FFFFFF;
  --pink:#A0607A; --pink-soft:#F0DEE6;
  --crit:#A8443C; --crit-soft:#F3DBD7; --on-crit:#FFFFFF;
  --warn:#86651F; --warn-soft:#EEE3C8; --ok:#4F7A62;
  --t1:#8B8597; --t2:#6A8DB8; --t3:#8A73B4; --t4:#C7819B; --t5:#BE953F;
  --font-display:'Noto Serif TC','Songti TC','PMingLiU',serif;
  --font-body:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1C1925; --surface:#25212F; --surface-2:#302B3D; --fg:#ECE8F3; --fg-2:#AAA3BC; --line:#3A3450;
    --accent:#B5A3DC; --accent-soft:#383050; --on-accent:#1A1524;
    --blue:#8EAAD2; --blue-soft:#27324A; --on-blue:#121B2A;
    --pink:#E3A9BC; --pink-soft:#3D2733;
    --crit:#F0928A; --crit-soft:#41231F; --on-crit:#2A100D;
    --warn:#E2BC6A; --warn-soft:#3A3120; --ok:#8FC4A8;
    --t1:#A29CAE; --t2:#8EAAD2; --t3:#B5A3DC; --t4:#E3A9BC; --t5:#E2C27A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1C1925; --surface:#25212F; --surface-2:#302B3D; --fg:#ECE8F3; --fg-2:#AAA3BC; --line:#3A3450;
  --accent:#B5A3DC; --accent-soft:#383050; --on-accent:#1A1524;
  --blue:#8EAAD2; --blue-soft:#27324A; --on-blue:#121B2A;
  --pink:#E3A9BC; --pink-soft:#3D2733;
  --crit:#F0928A; --crit-soft:#41231F; --on-crit:#2A100D;
  --warn:#E2BC6A; --warn-soft:#3A3120; --ok:#8FC4A8;
  --t1:#A29CAE; --t2:#8EAAD2; --t3:#B5A3DC; --t4:#E3A9BC; --t5:#E2C27A; color-scheme:dark;
}

  padding:0 max(4px,env(safe-area-inset-left,0px)) env(safe-area-inset-bottom,0px) max(4px,env(safe-area-inset-right,0px))}

<div class="wrap" id="app"></div>
<div id="toast" role="status" hidden></div>
<script>
// 丹爐・煉藥研究所：核心計算邏輯（純函式，不碰介面與資料庫）
// 規則來源：企劃書第四節與第十節。官方價格是唯一價格來源；沒有價格的藥材不當成免費。

// 名稱別名 → 標準名稱（企劃書第五節）
const ALIASES = {
  人蔘: '人參',
  九陽蔘: '九陽參',
  九天玄蔘: '九幽玄參',
  九天玄參: '九幽玄參',
};
const PILL_ALIASES = { 煉氣丹: '練氣丹' };

const canonicalName = (name) => ALIASES[name] ?? name;
const canonicalPill = (name) => PILL_ALIASES[name] ?? name;

// 把 [{name, qty}] 合併成 Map(標準名稱 → 總數量)；重複藥材加總
function mergeItems(items) {
  const m = new Map();
  for (const { name, qty } of items) {
    if (!Number.isInteger(qty) || qty <= 0) throw new Error(`數量必須是正整數：${name} × ${qty}`);
    const n = canonicalName(name);
    m.set(n, (m.get(n) ?? 0) + qty);
  }
  return m;
}

// prices: { 藥材名: 單價 }。缺價格就回報 missing，不當成 0。
function theoreticalCost(need, prices) {
  let total = 0;
  const missing = [];
  for (const [name, qty] of need) {
    const p = prices[name];
    if (p === undefined) missing.push(name);
    else total += p * qty;
  }
  return { total: missing.length ? null : total, missing };
}

// 缺少量 = max(需求 − 持有, 0)
function shortage(need, stock = {}) {
  const out = new Map();
  for (const [name, qty] of need) {
    const lack = Math.max(qty - (stock[name] ?? 0), 0);
    if (lack > 0) out.set(name, lack);
  }
  return out;
}

const scale = (need, times) => new Map([...need].map(([n, q]) => [n, q * times]));

// ---- 炸爐比對 ----
// exact：種類與數量都相同；contains：配方每種藥材數量都不少於炸爐組合（且不完全相同）；
// overlap：只有部分藥材相同；none：沒有共同藥材
function matchMode(recipeNeed, ruleNeed) {
  let shared = 0;
  let covers = true;
  for (const [n, q] of ruleNeed) {
    const have = recipeNeed.get(n) ?? 0;
    if (have > 0) shared++;
    if (have < q) covers = false;
  }
  if (shared === 0) return 'none';
  const sameKinds = recipeNeed.size === ruleNeed.size;
  if (covers && sameKinds && [...recipeNeed].every(([n, q]) => ruleNeed.get(n) === q)) return 'exact';
  if (covers) return 'contains';
  return 'overlap';
}

// 警報分級：完全相同＋已確認 → critical（排除）；完全相同＋待驗證 → pending（警告）；
// 包含 → suspect（疑似衝突）；部分重疊 → info（只提示，不判定）
function checkBlast(items, rules) {
  const need = mergeItems(items);
  const hits = [];
  for (const rule of rules) {
    const mode = matchMode(need, mergeItems(rule.items));
    if (mode === 'none') continue;
    // 只有「完全相同」可判定為炸爐。實際資料已有反例：大還丹（白芷＋寒心草＋人參）
    // 是有效配方，卻包含炸爐組合「人參×1、白芷×1」，所以「包含」只能算疑似。
    let level;
    if (mode === 'overlap') level = 'info';
    else if (mode === 'contains') level = 'suspect';
    else level = rule.status === '已確認' ? 'critical' : 'pending';
    hits.push({ code: rule.code, mode, level, basis: describe(mode, rule.status) });
  }
  const order = { critical: 0, pending: 1, suspect: 2, info: 3 };
  hits.sort((a, b) => order[a.level] - order[b.level]);
  return hits;
}

function describe(mode, status) {
  if (mode === 'overlap') return '與已知炸爐組合部分重疊，不能判定會炸爐';
  if (mode === 'contains') return `包含已知炸爐組合，是否會炸爐尚不能確定（炸爐紀錄狀態：${status}）`;
  return `與已知炸爐組合完全相同（炸爐紀錄狀態：${status}）`;
}

// ---- 最低成本計算 ----
/**
 * @param opts.pill            丹藥名稱（可寫煉氣丹，會轉成練氣丹）
 * @param opts.count           要做幾份
 * @param opts.recipes         全部配方 [{code,pill,status,items}]
 * @param opts.prices          { 藥材: 單價 }
 * @param opts.stock           { 藥材: 持有量 }
 * @param opts.useStock        是否扣抵個人庫存
 * @param opts.allowUnverified 是否納入非「已驗證」配方
 * @param opts.failureRules    炸爐組合
 * 回傳 { verified: [...], unverified: [...], excluded: [...] }，各組依採購成本由低到高
 */
function planPill(opts) {
  const { pill, count = 1, recipes, prices, stock = {}, useStock = true, allowUnverified = false, failureRules = [] } = opts;
  if (!Number.isInteger(count) || count <= 0) throw new Error('數量必須是正整數');
  const target = canonicalPill(pill);
  const rows = recipes
    .filter((r) => canonicalPill(r.pill) === target)
    .map((r) => {
      const need = scale(mergeItems(r.items), count);
      const theory = theoreticalCost(need, prices);
      const lack = useStock ? shortage(need, stock) : need;
      const purchase = theoreticalCost(lack, prices);
      const blast = checkBlast(r.items, failureRules);
      return {
        code: r.code,
        status: r.status,
        need: Object.fromEntries(need),
        theoryCost: theory.total,
        deducted: Object.fromEntries([...need].map(([n, q]) => [n, q - (lack.get(n) ?? 0)]).filter(([, d]) => d > 0)),
        toBuy: Object.fromEntries(lack),
        purchaseCost: purchase.total,
        missingPrice: theory.missing,
        blast,
        excluded: blast.some((b) => b.level === 'critical'),
      };
    });
  const kept = rows.filter((r) => !r.excluded);
  const byCost = (a, b) => (a.purchaseCost ?? Infinity) - (b.purchaseCost ?? Infinity);
  const verified = kept.filter((r) => r.status === '已驗證').sort(byCost);
  const unverified = allowUnverified ? kept.filter((r) => r.status !== '已驗證').sort(byCost) : [];
  const cheapest = verified[0] ?? unverified[0];
  for (const r of [...verified, ...unverified]) {
    r.diffFromCheapest = cheapest && r.purchaseCost !== null && cheapest.purchaseCost !== null ? r.purchaseCost - cheapest.purchaseCost : null;
  }
  return { verified, unverified, excluded: rows.filter((r) => r.excluded) };
}

// ---- 試煉：預測與下一步提示 ----
// a 的每種藥材數量都不超過 b（a 是 b 的子集合）
function isSubset(a, b) {
  for (const [n, q] of a) if ((b.get(n) ?? 0) < q) return false;
  return true;
}
function sameMix(a, b) {
  return a.size === b.size && [...a].every(([n, q]) => b.get(n) === q);
}
// 組合的穩定字串，用來判斷兩組是否相同
function mixKey(items) {
  return [...mergeItems(items)]
    .sort((x, y) => (x[0] < y[0] ? -1 : x[0] > y[0] ? 1 : 0))
    .map(([n, q]) => `${n}×${q}`)
    .join('、');
}
// 這組混合會變成什麼：完全相同的配方、完全相同的炸爐、包含的炸爐、部分重疊的炸爐
function predictMix(items, recipes, rules) {
  const need = mergeItems(items);
  const out = { recipes: [], blasts: [], contained: [], overlaps: [] };
  for (const r of recipes) if (sameMix(need, mergeItems(r.items))) out.recipes.push(r);
  for (const rule of rules) {
    const mode = matchMode(need, mergeItems(rule.items));
    if (mode === 'exact') out.blasts.push(rule);
    else if (mode === 'contains') out.contained.push(rule);
    else if (mode === 'overlap') out.overlaps.push(rule);
  }
  return out;
}
// 以目前選的藥材為基礎，再加幾份就會變成某個已知配方或炸爐組合。
// 只列「目前選的每種數量都不超過目標」的組合；total = 還差幾份。
function nextSteps(items, recipes, rules, maxMissing = 3) {
  if (!items.length) return [];
  const need = mergeItems(items);
  const res = [];
  const consider = (kind, target) => {
    const t = mergeItems(target.items);
    if (!isSubset(need, t)) return;
    const missing = [];
    let total = 0;
    for (const [n, q] of t) {
      const d = q - (need.get(n) ?? 0);
      if (d > 0) { missing.push({ name: n, qty: d }); total += d; }
    }
    if (total === 0 || total > maxMissing) return;
    res.push({ kind, code: target.code, pill: target.pill, missing, total });
  };
  for (const r of recipes) consider('recipe', r);
  for (const r of rules) consider('blast', r);
  const k = { blast: 0, recipe: 1 };
  res.sort((a, b) => a.total - b.total || k[a.kind] - k[b.kind] || (a.code < b.code ? -1 : 1));
  return res;
}

// ---- 解析 /抓藥 訊息：每一行「藥名〔品階〕－ 價格 碎銀」算一份 ----
function parseHaul(text, prices = null) {
  const items = new Map();
  const unknown = [];
  const mismatch = [];
  for (const line of String(text).split(/\r?\n/)) {
    const m = line.match(/([㐀-鿿]{2,6})\s*(?:〔[^〕]*〕)?\s*[－\-—–−]\s*(\d+)\s*碎銀/);
    if (!m) continue;
    const name = canonicalName(m[1]);
    const price = Number(m[2]);
    if (prices && !(name in prices)) { unknown.push(m[1]); continue; }
    if (prices && prices[name] !== price) mismatch.push({ name, price, official: prices[name] });
    items.set(name, (items.get(name) ?? 0) + 1);
  }
  return { items, unknown, mismatch };
}

    const n=canonicalName(it.name);
    if(!(n in PRICES)||!Number.isInteger(it.qty)||it.qty<1||it.qty>99)return null;
    raw.push({name:n,qty:it.qty});
  }
  const items=[...mergeItems(raw)].map(([name,qty])=>({name,qty}));
  let pill;
  if(e.result==='recipe'){pill=canonicalPill(String(e.pill||'').trim());if(!pill||pill.length>8)return null}
  return {result:e.result,pill,items,t:typeof e.t==='string'?e.t.slice(0,40):new Date().toISOString()};
}

/* ---------- Supabase 同步（只在設定好且已登入時動作） ---------- */
const signedIn=()=>SB.state==='in'&&SB.client&&SB.user;
let stockTimer;
function scheduleStockSync(){
  if(!signedIn()||S.exampleStock)return;
  clearTimeout(stockTimer);stockTimer=setTimeout(pushStock,800);
}
async function pushStock(){
  if(!signedIn())return;
  const cur=JSON.stringify(S.stock);if(cur===SB.lastStock)return;
  const rows=Object.entries(S.stock).filter(([n,q])=>n in PRICES&&q>0).map(([ingredient,qty])=>({user_id:SB.user.id,ingredient,qty}));
  try{
    if(rows.length){const r=await SB.client.from('inventory_items').upsert(rows);if(r.error)throw r.error}
    const keep=rows.map(r=>r.ingredient);
    const d=SB.client.from('inventory_items').delete().eq('user_id',SB.user.id);
    const r2=keep.length?await d.not('ingredient','in','('+keep.map(n=>'"'+n+'"').join(',')+')'):await d;
    if(r2.error)throw r2.error;
    SB.lastStock=cur;
  }catch(e){SB.msg='庫存同步失敗，稍後會再試：'+(e.message||e);scheduleStockSync();render()}
}
const entryRow=e=>({result:e.result,pill:e.pill||null,items:e.items});
async function pushLogEntry(e){
  if(!signedIn()||e.rid)return;
  const r=await SB.client.from('research_logs').insert(entryRow(e)).select('id').single();
  if(r.error)throw r.error;
  e.rid=r.data.id;save();
}
async function loadRemote(){
  if(!signedIn())return;
  try{
    const inv=await SB.client.from('inventory_items').select('ingredient,qty');
    if(inv.error)throw inv.error;
    if(inv.data.length){
      const st={};for(const r of inv.data)if(r.ingredient in PRICES&&r.qty>0)st[r.ingredient]=r.qty;
      S.stock=st;S.exampleStock=false;
    }else if(!S.exampleStock&&Object.keys(S.stock).length){SB.lastStock=null;await pushStock()}
    SB.lastStock=JSON.stringify(S.stock);
    const lg=await SB.client.from('research_logs').select('id,user_id,result,pill,items,created_at').order('id');
    if(lg.error)throw lg.error;
    const mine=lg.data.filter(r=>r.user_id===SB.user.id),mineKeys=new Set(mine.map(r=>r.result+'|'+(r.pill||'')+'|'+mixKey(r.items)));
    // 本機有、雲端沒有的紀錄補上傳；雲端有、本機沒有的拉下來
    for(const e of S.log){
      const k=e.result+'|'+(e.pill||'')+'|'+mixKey(e.items);
      if(!e.rid&&!mineKeys.has(k))await pushLogEntry(e);
      else if(!e.rid){const m=mine.find(r=>r.result+'|'+(r.pill||'')+'|'+mixKey(r.items)===k);if(m)e.rid=m.id}
    }
    const have=new Set(S.log.map(e=>e.rid));
    for(const r of mine){
      if(have.has(r.id))continue;
      const n=normalizeEntry({result:r.result,pill:r.pill,items:r.items,t:r.created_at});
      if(n)S.log.push({id:S.nextId++,rid:r.id,...n});
    }
    SB.others=[];
    for(const r of lg.data){
      if(r.user_id===SB.user.id)continue;
      const n=normalizeEntry({result:r.result,pill:r.pill,items:r.items,t:r.created_at});
      if(n)SB.others.push({id:r.id,...n});
    }
    const p=await SB.client.from('profiles').select('role').eq('user_id',SB.user.id).maybeSingle();
    SB.role=p.data?p.data.role:'member';
    SB.msg='';refreshWorld();save();render();
  }catch(e){SB.msg='同步失敗：'+(e.message||e);render()}
}
async function initSupabase(){
  if(SB.state==='off')return;
  try{
    await new Promise((ok,bad)=>{const s=document.createElement('script');
      s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js';
      s.onload=ok;s.onerror=()=>bad(new Error('無法載入登入元件，請確認網路'));document.head.appendChild(s)});
    SB.client=window.supabase.createClient(SUPABASE.url,SUPABASE.anonKey,{auth:{persistSession:true,detectSessionInUrl:true}});
    const apply=async session=>{
      if(session&&SB.state==='in'&&SB.user&&SB.user.id===session.user.id){SB.user=session.user;return}
      SB.user=session?session.user:null;SB.state=SB.user?'in':'out';
      if(!SB.user){SB.others=[];refreshWorld();render();return}
      render();await loadRemote();
    };
    SB.client.auth.onAuthStateChange((ev,session)=>{setTimeout(()=>apply(session),0)});
    const {data}=await SB.client.auth.getSession();
    if(data.session)await apply(data.session);else{SB.state='out';render()}
  }catch(e){SB.state='out';SB.msg=String(e.message||e);render()}
}

function recipeCard(r,best){
  const rec=RECIPES.find(x=>x.code===r.code);
  const lines=Object.keys(r.need).map(n=>{
    const buy=r.toBuy[n]||0,ded=r.deducted[n]||0;
    const note=ded&&buy?` <small>（庫存 ${ded}）</small>`:'';
    return `<li><span class="nm">${dot(n)}<span>${esc(n)}${note}</span></span><span class="q">×${r.need[n]}</span><span class="buy ${buy?'':'free'}">${buy?`買 ${buy} · ${fmt(buy*PRICES[n])}`:'用庫存'}</span></li>`;
  }).join('');
  const mk=S.useStock?maxMake(rec.items):0;
  const dedCount=Object.keys(r.deducted).length;
  const armed=S.armed===r.code;
  const diff=r.diffFromCheapest;
  const needBuy=Object.keys(r.toBuy).length>0;
  return `<article class="card ${best?'best':''}">
    <div class="head"><div class="who"><div class="tags">${best?'<span class="tag best">最低成本</span>':''}<span class="tag">${esc(r.status)}</span>${mineTag(rec)}</div><span class="code">配方 ${r.code}</span></div>
    <div class="price"><b>${fmt(r.purchaseCost)}</b><span>${S.useStock?'需另付碎銀':'碎銀'}</span></div></div>
    <div class="meta"><span>理論成本 <b class="num">${fmt(r.theoryCost)}</b></span>${dedCount?`<span>庫存抵扣 <b class="num">${fmt(r.theoryCost-r.purchaseCost)}</b></span>`:''}${diff>0?`<span>比最低多 <b class="num">${fmt(diff)}</b></span>`:''}${mk>=1?`<span>庫存最多可煉 <b class="num">${mk}</b> 份</span>`:''}</div>
    <ul class="ing">${lines}</ul>
    ${alertsSplit(r.blast)}
    <div class="actions">${S.useStock&&dedCount?`<button type="button" class="btn ${armed?'armed':''}" data-act="brew" data-code="${r.code}">${armed?'再按一次，確認扣除庫存':'煉了這個，扣除庫存'}</button>`:''}${needBuy?`<button type="button" class="btn quiet" data-act="copy-list" data-code="${r.code}">複製採購清單</button>`:''}</div>
  </article>`;
}
function calcView(){

}

/* ---------- 試煉 ---------- */
function labView(){
  const items=mixItems();
  const n=items.reduce((a,i)=>a+i.qty,0);
  const pred=items.length?predictMix(items,RECIPES,RULE_LIST):null;
  const steps=nextSteps(items,RECIPES,RULE_LIST,3);
  const mark={};
  for(const s of steps.filter(s=>s.total===1)){
    const nm=s.missing[0].name;(mark[nm]=mark[nm]||{boom:[],warn:[],pill:[]});
    if(s.kind==='blast'){(RULES[s.code].status==='已確認'?mark[nm].boom:mark[nm].warn).push(s.code)}else if(!mark[nm].pill.includes(s.pill))mark[nm].pill.push(s.pill);
  }
  let state='empty',stText='尚未選藥材';
  if(pred){
    const confirmed=pred.blasts.filter(r=>r.status==='已確認'),pend=pred.blasts.filter(r=>r.status!=='已確認');
    if(confirmed.length){state='boom';stText='會炸爐'}
    else if(pred.recipes.length){state='pill';stText='煉成 '+[...new Set(pred.recipes.map(r=>r.pill))].join('、')}
    else if(pend.length){state='warn';stText='待驗證的炸爐組合'}
    else{state=pred.contained.length?'warn':'unknown';stText=pred.contained.length?'疑似衝突':'資料庫沒有這組'}
  }
  const tray=items.length?items.map(i=>`<button type="button" class="chip" data-act="mix-sub" data-n="${esc(i.name)}" aria-label="減少${esc(i.name)}">${dot(i.name)}${esc(i.name)}<b>×${i.qty}</b><span aria-hidden="true">−</span></button>`).join(''):'<span class="hint">點下面的藥材加進來</span>';
  const bar=`<div class="stick"><div class="srow"><span class="st ${state}">${stText}</span><span class="hint num">${items.length?`共 ${n} 份 · ${fmt(cost(items))} 碎銀`:''}</span><button type="button" class="btn quiet" data-act="mix-clear" style="min-height:34px;padding:0 10px">清除</button></div><div class="tray">${tray}</div></div>`;

  let result='';
  if(pred){
    const contained=pred.contained.map(r=>alertHtml({code:r.code,level:'suspect',basis:'包含已知炸爐組合，是否會炸爐尚不能確定'})).join('');
    const ov=pred.overlaps.length?`<details><summary>另有 ${pred.overlaps.length} 組只部分重疊，不判定為炸爐</summary>${pred.overlaps.map(r=>ruleRow(r.code,ruleText(r))).join('')}</details>`:'';
    if(state==='boom'){
      result=`<div class="result boom"><span class="big">會炸爐</span><span>與已確認的炸爐組合完全相同：</span>${pred.blasts.filter(r=>r.status==='已確認').map(r=>`<span class="rule">${r.code}　${esc(ruleText(r))} ${mineTag(r)}</span>`).join('')}${pred.recipes.length?`<span class="hint">注意：資料同時把這組列為配方 ${pred.recipes.map(r=>r.code).join('、')}，請先確認哪一筆有誤。</span>`:''}</div>`;
    }else if(state==='pill'){
      result=`<div class="result pill"><span class="big">煉成 ${esc([...new Set(pred.recipes.map(r=>r.pill))].join('、'))}</span><span>與已知配方完全相同：</span>${pred.recipes.map(r=>`<span class="rule">${r.code}　${esc(r.pill)}　${esc(r.status)} ${mineTag(r)}</span>`).join('')}${contained}${ov}</div>`;
    }else if(pred.blasts.length){
      result=`<div class="result unknown"><span class="big">待驗證的炸爐組合</span><span>有人提交這組會炸爐，但還沒被確認，只當警告：</span>${pred.blasts.map(r=>`<span class="rule">${r.code}　${esc(ruleText(r))}</span>`).join('')}${contained}${ov}</div>`;
    }else{
      result=`<div class="result unknown"><span class="big">資料庫沒有這組</span><span class="hint">還沒有人記錄過這組的結果。試了之後把結果記下來，下次就會提示。</span>${contained}${ov}</div>`;
    }
  }
  let hints='';
  if(items.length){
    const warnH=Object.entries(mark).filter(([,m])=>m.warn.length&&!m.boom.length),boom=Object.entries(mark).filter(([,m])=>m.boom.length),mk=Object.entries(mark).filter(([,m])=>m.pill.length);
    const lbl=nm=>nm in S.mix?`多加 1 份${nm}`:`加${nm}`;
    if(boom.length)hints+=`<div class="alert critical"><b>下一份加這些，會炸爐</b><div class="chips">${boom.map(([nm,m])=>`<span class="chip boom">${esc(lbl(nm))}<b>${m.boom.join('、')}</b></span>`).join('')}</div></div>`;
    if(warnH.length)hints+=`<div class="alert pending"><b>下一份加這些，會到待驗證的炸爐組合</b><div class="chips">${warnH.map(([nm,m])=>`<span class="chip">${esc(lbl(nm))}<b>${m.warn.join('、')}</b></span>`).join('')}</div></div>`;
    if(mk.length)hints+=`<div class="alert recipe"><b>下一份加這些，會煉成</b><div class="chips">${mk.map(([nm,m])=>`<span class="chip pill">${esc(lbl(nm))}<b>→ ${esc(m.pill.join('、'))}</b></span>`).join('')}</div></div>`;
    const later=steps.filter(s=>s.total>=2);
    if(later.length)hints+=`<details class="panel"><summary>再加 2 到 3 份才會到的已知組合（${later.length}）</summary>${later.slice(0,40).map(s=>ruleRow(s.code,`${s.kind==='blast'?'炸爐':'煉成'+s.pill}：再加 ${s.missing.map(m=>m.name+'×'+m.qty).join('、')}`)).join('')}${later.length>40?`<p class="hint">還有 ${later.length-40} 組沒有列出。</p>`:''}</details>`;
    if(!steps.length)hints=`<p class="hint">資料庫裡沒有以這組為基礎的已知組合。這不代表安全，只是還沒有人記錄。</p>`;
  }
  let record='';
  if(items.length&&(state==='unknown'||state==='warn')){
    record=`<section class="panel"><h2>試過了？記錄結果</h2><p class="hint">記下來會加進試煉提示與成本計算，只存在這台裝置。</p>
    <button type="button" class="btn solid" data-act="log-boom">這組炸爐了</button>
    <select id="log-pill" class="in-text" aria-label="煉成的丹藥">${PILLS.map(p=>`<option value="${esc(p)}" ${p===S.logPill?'selected':''}>${esc(p)}</option>`).join('')}</select>
    <input id="log-new" class="in-text" type="text" maxlength="8" placeholder="或輸入新丹藥名稱" value="${esc(S.newPill)}" aria-label="新丹藥名稱">
    <button type="button" class="btn" data-act="log-pill">這組煉成了</button></section>`;
  }
  let idx=0;
  const grid=TIERS.slice().reverse().map(t=>{const list=ING.filter(i=>i.tier===t);return `<section class="grp"><h3>${dot(list[0].name)}${t}<small class="num">${list[0].price}–${list[list.length-1].price} 碎銀</small></h3><div class="mixgrid">${list.map(i=>{
    const v=S.mix[i.name]||0,m=mark[i.name];let cls='',tag='',tip='';
    if(m&&m.boom.length){cls='boom';tag='<span class="mk boom">會炸爐</span>';tip='，再加會炸爐'}
    else if(m&&m.warn.length&&!m.pill.length){cls='warn';tag='<span class="mk warn">待驗證炸爐</span>';tip='，再加會到待驗證的炸爐組合'}
    else if(m&&m.pill.length){cls='pill';tag=`<span class="mk pill">${esc(m.pill[0])}${m.pill.length>1?'…':''}</span>`;tip='，再加會煉成'+m.pill.join('、')}
    idx++;
    return `<div class="tile ${cls} ${v?'on':''}"><button type="button" class="add" data-act="mix-add" data-n="${esc(i.name)}" aria-label="加入${esc(i.name)}，目前 ${v} 份${tip}"><span class="tn">${dot(i.name)}${esc(i.name)}</span><span class="tp"><span class="num">${i.price}</span>${v?`<b class="cnt">×${v}</b>`:''}</span>${tag}</button>${v?`<button type="button" class="sub" data-act="mix-sub" data-n="${esc(i.name)}" aria-label="減少${esc(i.name)}">−</button>`:''}</div>`}).join('')}</div></section>`}).join('');
  return `<section class="panel"><h2>試煉台</h2><p class="hint">一份一份加藥材，看會變成什麼。紅框的藥材再加一份就會炸爐，藍框的會煉成已知丹藥。</p>${S.mixExample?'<div class="banner"><b>已放入白芷＋寒心草當範例。</b>改任何一份就會清掉這個提示。</div>':''}</section>
  ${bar}${result}${hints}${record}${grid}
  <details class="panel"><summary>全部 ${RULE_LIST.length} 組已確認炸爐</summary>${RULE_LIST.map(r=>ruleRow(r.code,ruleText(r)+(r.mine?'（我的紀錄）':''))).join('')}</details>`;
}

function render(){

  const head=`<header class="brand"><h1>丹爐</h1><p>煉藥研究所 · 價格以賣藥文字為準</p></header>`;

  const foot=`<p class="foot">資料 2026-10-18 · ${ING.length} 種藥材 · ${RECIPES.length} 筆配方 · ${RULE_LIST.length} 組炸爐</p>`;
  document.getElementById('app').innerHTML=head+fb+views[S.tab]()+foot;
  let nav=document.querySelector('nav.tabs');
  if(!nav){nav=document.createElement('nav');nav.className='tabs';nav.setAttribute('aria-label','主選單');document.body.appendChild(nav)}
  nav.innerHTML=`<div class="in">${TABS.map(([k,l])=>`<button type="button" data-act="tab" data-tab="${k}" ${k===S.tab?'aria-current="page"':''}>${l}</button>`).join('')}</div>`;
}
let tt;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>{t.hidden=true},2400)}
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
function setQty(kind,n,v){
  v=clamp(Number.isFinite(v)?Math.floor(v):0,0,999);
  if(kind==='stock'){if(v)S.stock[n]=v;else delete S.stock[n];S.exampleStock=false;save()}
}
function setMix(n,v){v=clamp(v,0,99);if(v)S.mix[n]=v;else delete S.mix[n];S.mixExample=false}
async function copyText(text,okMsg){
  try{await navigator.clipboard.writeText(text);toast(okMsg)}
  catch(e){S.fallback=text;render();window.scrollTo(0,0)}
}
function addLog(entry){
  const e={id:S.nextId++,t:new Date().toISOString(),...entry};
  S.log.push(e);refreshWorld();save();
  pushLogEntry(e).catch(err=>{SB.msg='紀錄只存在本機，上傳失敗：'+(err.message||err);render()});
}
function doBrew(code){
  const r=[...plan().verified,...plan().unverified].find(x=>x.code===code);
  if(!r)return;
  for(const [n,d] of Object.entries(r.deducted))setQty('stock',n,(S.stock[n]||0)-d);
  toast('已扣除庫存');
}
function listText(code){
  const r=[...plan().verified,...plan().unverified].find(x=>x.code===code);
  if(!r)return '';
  const buy=Object.entries(r.toBuy).map(([n,q])=>`${n}×${q}`).join('、');
  return `${S.pill} × ${S.count}（配方 ${code}）\n要買：${buy}\n需另付 ${r.purchaseCost} 碎銀`;
}
function doHaul(){
  const res=parseHaul(S.haulText,PRICES);
  if(!res.items.size){S.haulNote='沒有讀到藥材。請整段貼上含「－ 數字 碎銀」的行。';return}
  let total=0;
  if(S.exampleStock)S.stock={};
  for(const [n,q] of res.items){S.stock[n]=(S.stock[n]||0)+q;total+=q}
  S.exampleStock=false;save();
  let note=`已加入 ${total} 份（${res.items.size} 種）。`;
  if(res.unknown.length)note+=` 認不得：${[...new Set(res.unknown)].join('、')}。`;
  if(res.mismatch.length)note+=` 價格和官方不同：${res.mismatch.map(m=>`${m.name} ${m.price}≠${m.official}`).join('、')}（仍已加入）。`;
  S.haulNote=note;S.haulText='';
}
function doImport(){
  let arr,stockIn=null;
  try{arr=JSON.parse(S.importText)}catch(e){toast('格式不對，請貼上匯出的文字');return}
  if(arr&&!Array.isArray(arr)&&typeof arr==='object'){
    if(arr.stock&&typeof arr.stock==='object'){
      const st={};for(const [n,v] of Object.entries(arr.stock)){const k=canonicalName(n);if(k in PRICES&&Number.isInteger(v)&&v>0&&v<=999)st[k]=v}
      if(Object.keys(st).length)stockIn=st;
    }
    arr=arr.log;
  }
  if(!Array.isArray(arr)){toast('格式不對，請貼上匯出的文字');return}
  if(stockIn){S.stock=stockIn;S.exampleStock=false}
  const seen=new Set(S.log.map(e=>e.result+'|'+(e.pill||'')+'|'+mixKey(e.items)));
  let added=0,skipped=0;
  for(const raw of arr){
    const n=normalizeEntry(raw);
    if(!n){skipped++;continue}
    const k=n.result+'|'+(n.pill||'')+'|'+mixKey(n.items);
    if(seen.has(k)){skipped++;continue}
    seen.add(k);S.log.push({id:S.nextId++,...n});added++;
  }
  refreshWorld();save();S.importText='';
  toast(`匯入 ${added} 筆${skipped?`，略過 ${skipped} 筆`:''}`);
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act;
  if(a!=='brew'&&a!=='stock-clear'&&a!=='log-del')S.armed=null;
  switch(a){
    case 'tab':S.tab=b.dataset.tab;save();render();window.scrollTo(0,0);return;
    case 'pill':S.pill=b.dataset.pill;save();break;
    case 'try':S.pill=b.dataset.pill;S.tab='calc';save();render();window.scrollTo(0,0);return;
    case 'to-lab':{const r=RECIPES.find(x=>x.code===b.dataset.code);if(r){S.mix=Object.fromEntries(mergeItems(r.items));S.mixExample=false;S.tab='lab';save();render();window.scrollTo(0,0)}return}
    case 'to-lab-log':{const r=S.log.find(x=>x.id===Number(b.dataset.id));if(r){S.mix=Object.fromEntries(mergeItems(r.items));S.mixExample=false;S.tab='lab';save();render();window.scrollTo(0,0)}return}
    case 'cnt+':S.count=clamp(S.count+1,1,99);save();break;
    case 'cnt-':S.count=clamp(S.count-1,1,99);save();break;
    case 'toggle-stock':S.useStock=!S.useStock;save();break;
    case 'toggle-unv':S.allowUnverified=!S.allowUnverified;save();break;
    case 'inc':case 'dec':{const n=b.dataset.n;setQty('stock',n,(S.stock[n]||0)+(a==='inc'?1:-1));break}
    case 'mix-add':setMix(b.dataset.n,(S.mix[b.dataset.n]||0)+1);break;
    case 'mix-sub':setMix(b.dataset.n,(S.mix[b.dataset.n]||0)-1);break;
    case 'mix-clear':S.mix={};S.mixExample=false;break;
    case 'log-boom':{const items=mixItems();if(items.length){addLog({result:'blast',items});toast('已記錄：這組會炸爐')}break}
    case 'log-pill':{
      const items=mixItems();if(!items.length)break;
      const sel=document.getElementById('log-pill');
      const name=canonicalPill((S.newPill||'').trim()||(sel?sel.value:''));
      if(!name||name.length>8){toast('請輸入 1 到 8 個字的丹藥名稱');return}
      addLog({result:'recipe',pill:name,items});S.newPill='';toast(`已記錄：煉成 ${name}`);break}
    case 'log-del':
      if(S.armed==='del'+b.dataset.id){
        const gone=S.log.find(x=>x.id===Number(b.dataset.id));
        S.log=S.log.filter(x=>x.id!==Number(b.dataset.id));S.armed=null;refreshWorld();save();toast('已刪除');
        if(gone&&gone.rid&&signedIn())SB.client.from('research_logs').delete().eq('id',gone.rid).then(r=>{if(r.error){SB.msg='雲端刪除失敗：'+r.error.message;render()}});
      }
      else S.armed='del'+b.dataset.id;
      break;
    case 'log-copy':copyText(document.getElementById('export-text').value,'已複製紀錄');return;
    case 'log-import':doImport();break;
    case 'sign-in':{
      const em=(S.email||'').trim();
      if(!/^\S+@\S+\.\S+$/.test(em)){SB.msg='請輸入正確的信箱';break}
      SB.msg='寄送中…';render();
      SB.client.auth.signInWithOtp({email:em,options:{emailRedirectTo:location.href.split('#')[0]}}).then(r=>{
        SB.msg=r.error?'寄送失敗：'+r.error.message:'已寄出，請到信箱點連結回來（也看看垃圾郵件匣）。';render()});
      return}
    case 'sign-out':SB.client.auth.signOut().then(()=>{SB.state='out';SB.user=null;SB.role='member';SB.others=[];SB.lastStock=null;SB.msg='';refreshWorld();render()});return;
    case 'sync-now':SB.msg='';SB.lastStock=null;pushStock().then(loadRemote);toast('同步中');return;
    case 'haul-add':doHaul();break;
    case 'stock-clear':
      if(S.armed==='clear'){S.stock={};S.exampleStock=false;S.armed=null;save();toast('庫存已清空')}else S.armed='clear';
      break;
    case 'brew':
      if(S.armed!==b.dataset.code)S.armed=b.dataset.code;
      else{doBrew(b.dataset.code);S.armed=null}
      break;
    case 'copy-list':copyText(listText(b.dataset.code),'已複製採購清單');return;
    case 'fallback-close':S.fallback='';break;
    default:return;
  }
  render();
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t instanceof HTMLSelectElement&&t.id==='log-pill'){S.logPill=t.value;return}
  if(!(t instanceof HTMLInputElement))return;
  if(t.dataset.k==='count'){S.count=clamp(parseInt(t.value,10)||1,1,99);save();render()}
  else if(t.dataset.k==='stock'){setQty('stock',t.dataset.n,parseInt(t.value,10));render()}
});
document.addEventListener('input',e=>{
  const t=e.target;if(!t)return;
  if(t.id==='q-recipes'){
    S.q=t.value;
    const tmp=document.createElement('div');tmp.innerHTML=recipesView();
    document.getElementById('recipe-list').innerHTML=tmp.querySelector('#recipe-list').innerHTML;
  }else if(t.id==='haul-text')S.haulText=t.value;
  else if(t.id==='log-new')S.newPill=t.value;
  else if(t.id==='import-text')S.importText=t.value;
  else if(t.id==='login-email')S.email=t.value;
});
render();
initSupabase();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
